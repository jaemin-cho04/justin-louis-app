name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        platform: [android, ios, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo export --platform ${{ matrix.platform }} --output-dir dist-${{ matrix.platform }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db lint --level error
      - run: supabase test db

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts

  e2e-ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: futureware-tech/simulator-action@v3
        with:
          model: iPhone 16 Pro
      - run: npm ci
      - name: Build and install the iOS app
        run: npx expo run:ios --device "iPhone 16 Pro" --configuration Release --no-bundler
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run critical user journeys
        run: |
          "$HOME/.maestro/bin/maestro" test e2e/maestro
      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-diagnostics
          path: ~/.maestro/tests
          if-no-files-found: ignore
