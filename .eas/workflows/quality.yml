on:
  workflow_dispatch:
  pull_request:

jobs:
  verify:
    name: Typecheck and domain tests
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run verify

  build_android:
    name: Android preview build
    needs: [verify]
    type: build
    params:
      platform: android
      profile: preview

  android_e2e:
    name: Android user journeys
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: e2e/maestro
      retries: 1
      record_screen: true

  build_ios:
    name: iOS Simulator preview build
    needs: [verify]
    type: build
    params:
      platform: ios
      profile: preview

  ios_e2e:
    name: iOS user journeys
    needs: [build_ios]
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: e2e/maestro
      retries: 1
      record_screen: true
